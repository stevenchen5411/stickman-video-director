name: Batch job

# Heavy engine jobs that used to run on the phone. The package lives in the PRIVATE jobs repo
# (stevenchen5411/near-stickman-jobs, queue/<id>.json) and the result is published to that repo's Releases,
# so nothing about unreleased videos is public. Public-repo Actions minutes are free.
on:
  repository_dispatch:
    types: [batch-job]
  workflow_dispatch:
    inputs:
      job:
        description: "Job type"
        required: true
        type: choice
        options: [draft-render]
      package_id:
        description: "Package id in the jobs repo queue/ (e.g. pkg_20261113_Cg_GW7yhq20)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: batch-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ github.event.client_payload.job || inputs.job }}
      PACKAGE_ID: ${{ github.event.client_payload.package_id || inputs.package_id }}
      JOBS_REPO: stevenchen5411/near-stickman-jobs
      STICKMAN_CHATTERBOX_URL: ${{ secrets.STICKMAN_CHATTERBOX_URL }}
      STICKMAN_CHATTERBOX_ID_URL: ${{ secrets.STICKMAN_CHATTERBOX_ID_URL }}
      STICKMAN_F5_ID_URL: ${{ secrets.STICKMAN_F5_ID_URL }}
      MODAL_PROXY_KEY: ${{ secrets.MODAL_PROXY_KEY }}
      MODAL_PROXY_SECRET: ${{ secrets.MODAL_PROXY_SECRET }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$JOB" in draft-render) ;; *) echo "unknown job: $JOB" >&2; exit 1 ;; esac
          [[ "$PACKAGE_ID" =~ ^[A-Za-z0-9_-]{3,80}$ ]] || { echo "bad package_id" >&2; exit 1; }

      - uses: actions/checkout@v4

      - name: Fetch package from the private jobs repo
        env:
          JOBS_REPO_TOKEN: ${{ secrets.JOBS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${JOBS_REPO_TOKEN}@github.com/${JOBS_REPO}.git" "$RUNNER_TEMP/jobs"
          test -f "$RUNNER_TEMP/jobs/queue/${PACKAGE_ID}.json"
          mkdir -p queue && cp "$RUNNER_TEMP/jobs/queue/${PACKAGE_ID}.json" "queue/${PACKAGE_ID}.json"
          rm -rf "$RUNNER_TEMP/jobs"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config python3-dev fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install Python dependencies
        run: pip install -r engine/requirements.txt

      - name: Install the generated asset pack
        run: python3 engine/assetgen/build.py --library assets/library > /dev/null

      - name: Render draft 480p (audio-first)
        run: |
          mkdir -p renders
          python3 engine/render_cairo.py --package "queue/${PACKAGE_ID}.json" --draft-480p --out renders

      - name: Verify outputs
        run: |
          test -s "renders/${PACKAGE_ID}_draft.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of compact "renders/${PACKAGE_ID}_draft.mp4"

      - name: Publish to the private jobs repo Releases
        env:
          GH_TOKEN: ${{ secrets.JOBS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="draft-${PACKAGE_ID}"
          FILES=("renders/${PACKAGE_ID}_draft.mp4")
          [ -s "renders/${PACKAGE_ID}_cover.jpg" ] && FILES+=("renders/${PACKAGE_ID}_cover.jpg")
          gh release delete "$TAG" -R "$JOBS_REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${FILES[@]}" -R "$JOBS_REPO" --title "Draft ${PACKAGE_ID}" --notes "480p audio-first draft of ${PACKAGE_ID}."
